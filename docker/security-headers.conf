# Заголовки безопасности — «Инфраструктура» → «Docker и Nginx». Подключается в каждый location,
# где есть свой add_header (иначе nginx не наследует заголовки сервера).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Content-Security-Policy: генерируется при сборке образа (docker/nginx-csp.sh).
include /etc/nginx/csp.conf;
