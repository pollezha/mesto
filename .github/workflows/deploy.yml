# Инфраструктура → «Деплой». push в main → проверки и сборка → два образа (стадии app и nginx) с тегом sha
# в GHCR → по SSH на VPS: docker compose pull && docker compose up -d. Откат — запуск предыдущего тега образов.
#
# Н75: все actions закреплены полным SHA коммита (комментарий — версия); обновляет Dependabot (.github/dependabot.yml).
#
# Нужно от владельца (Settings → Secrets and variables → Actions):
#   secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS (вывод ssh-keyscan для VPS), SSH_PORT (необязательно);
#   variables: DEPLOY_ENABLED=true (включает job deploy), DEPLOY_PATH (папка с docker-compose.yml на VPS),
#              NUXT_PUBLIC_ANALYTICS_ENABLED, NUXT_PUBLIC_GA_ID, NUXT_PUBLIC_YM_ID, NUXT_PUBLIC_SITE_URL (не секреты:
#              попадают в пререндеренный HTML при сборке образа nginx; пусто — значения по умолчанию).
# Почта (Н71): job deploy при каждом выкате сам записывает файл окружения приложения на VPS (DEPLOY_PATH, права 600)
#   из секретов репозитория: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM, MAIL_TO (обязательны),
#   SMTP_SECURE (необязателен: пусто = false, STARTTLS; true/1 — TLS сразу, обычно порт 465),
#   SMTP_FAMILY (необязателен, Н84: пусто = как раньше; 6 — подключаться к SMTP по IPv6. Нужен на HostVDS, где
#   исходящие SMTP-порты по IPv4 закрыты; контейнеры для этого сидят в сети mesto_net с IPv6, см. docker-compose.yml).
#   Список обязательных строже приложения: lead.ts требует только SMTP_HOST, MAIL_FROM, MAIL_TO, но почта владельца
#   работает только с авторизацией, поэтому SMTP_PORT, SMTP_USER и SMTP_PASS тоже обязательны.
#   Если обязательный секрет пуст, а также если DEPLOY_PATH пуст или не начинается с /, деплой падает до любых
#   изменений на сервере. Значение секрета не может содержать одинарную кавычку, перевод строки и не может
#   заканчиваться обратной косой чертой. Значения идут в stdin SSH, не в аргументах и не в логах.
#   Файл на VPS руками править не нужно: он перезаписывается при выкате.
#   Секреты нужны только при push в main; pull_request этот workflow не запускает (репозиторий публичный).
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # GHCR требует имя в нижнем регистре.
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Имя владельца строчными
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
      - name: Образ app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: app
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/mesto-app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Образ nginx (страницы пререндерятся при сборке — публичные переменные передаются build args)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: nginx
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/mesto-nginx:${{ github.sha }}
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL || 'https://mesto.studio' }}
            NUXT_PUBLIC_ANALYTICS_ENABLED=${{ vars.NUXT_PUBLIC_ANALYTICS_ENABLED || 'false' }}
            NUXT_PUBLIC_GA_ID=${{ vars.NUXT_PUBLIC_GA_ID }}
            NUXT_PUBLIC_YM_ID=${{ vars.NUXT_PUBLIC_YM_ID }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

  deploy:
    needs: images
    # Включается переменной репозитория DEPLOY_ENABLED=true, когда готовы VPS, секреты SSH и почтовые секреты
    # (SMTP_*, MAIL_*, см. шапку): без них первый шаг job остановит деплой.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Н78: только чтение репозитория и образов (токен нужен для docker login на VPS).
    permissions:
      contents: read
      packages: read
    env:
      OWNER: ${{ github.repository_owner }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Первым шагом, до любых действий на сервере. Без set -x и без вывода значений.
      - name: Проверить почтовые секреты и собрать файл окружения
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_FAMILY: ${{ secrets.SMTP_FAMILY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set +x
          # Иначе scp и запись файла окружения уйдут в домашнюю папку пользователя SSH.
          case "$DEPLOY_PATH" in
            /*) ;;
            *)
              echo "::error::Переменная репозитория DEPLOY_PATH пуста или не абсолютный путь (должна начинаться с /). Деплой остановлен, сервер не тронут."
              exit 1
              ;;
          esac
          missing=''
          for name in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM MAIL_TO; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты репозитория:$missing. Settings → Secrets and variables → Actions. Деплой остановлен, сервер не тронут."
            exit 1
          fi
          # Значения пишутся в одинарных кавычках (в файле окружения compose они буквальные), поэтому
          # одинарная кавычка, перевод строки и обратная косая черта в конце значения недопустимы
          # (завершающий \ экранирует закрывающую кавычку). Сами значения не выводятся.
          for name in SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_FAMILY SMTP_USER SMTP_PASS MAIL_FROM MAIL_TO; do
            value="${!name}"
            case "$value" in
              *"'"*|*$'\n'*|*$'\r'*|*'\')
                echo "::error::Секрет $name содержит одинарную кавычку, перевод строки или заканчивается обратной косой чертой: так значение не записать. Деплой остановлен."
                exit 1
                ;;
            esac
          done
          umask 077
          out="$RUNNER_TEMP/app-env"
          : > "$out"
          for name in SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_FAMILY SMTP_USER SMTP_PASS MAIL_FROM MAIL_TO; do
            printf "%s='%s'\n" "$name" "${!name}" >> "$out"
          done
      - name: Настроить SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Обновить compose-файл и настройки почты на VPS, перезапустить
        run: |
          set +x
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes $SSH_TARGET"
          scp -i "$HOME/.ssh/deploy_key" -P "$SSH_PORT" -o StrictHostKeyChecking=yes             docker-compose.yml "$SSH_TARGET:$DEPLOY_PATH/docker-compose.yml"
          # Файл окружения приложения (Н71): содержимое идёт через stdin, на сервере пишется во временный файл
          # с umask 077 и атомарно заменяет рабочий (mv в той же папке). Значения не попадают в аргументы.
          $SSH "cd '$DEPLOY_PATH' && umask 077 && cat > .tmp-app-env && chmod 600 .tmp-app-env && mv -f .tmp-app-env .env" < "$RUNNER_TEMP/app-env"
          rm -f "$RUNNER_TEMP/app-env"
          # Токен передаётся через stdin на время job: образы в GHCR могут быть приватными.
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          # Тег и владелец сохраняются в release.env рядом с compose: ручные pull/up на VPS идут с текущим тегом.
          # Н78: токен GHCR не остаётся на VPS — docker logout выполняется и при ошибке pull/up (код возврата сохраняется).
          rc=0
          $SSH "cd '$DEPLOY_PATH' && echo 'GHCR_OWNER=${OWNER,,}' > release.env && echo 'IMAGE_TAG=${{ github.sha }}' >> release.env && docker compose --env-file release.env pull && docker compose --env-file release.env up -d --remove-orphans" || rc=$?
          $SSH "docker logout ghcr.io" || true
          exit "$rc"
