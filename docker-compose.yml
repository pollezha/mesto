# Инфраструктура → «Docker и Nginx», «Деплой» (Р20).
#
# Тег и владелец образов лежат в файле release.env рядом с compose (не в файле с секретами приложения):
#   GHCR_OWNER=<владелец в GHCR, строчными>   IMAGE_TAG=<sha коммита>
# Его пишет деплой (CI) при каждом выкате, поэтому ручные команды работают на текущем задеплоенном теге:
#   docker compose --env-file release.env pull && docker compose --env-file release.env up -d
# Откат на предыдущий тег (значение из оболочки перекрывает файл; чтобы закрепить откат, поправьте release.env):
#   IMAGE_TAG=<sha> docker compose --env-file release.env up -d
# Без --env-file compose остановится с ошибкой: тега по умолчанию нет.
# Секреты приложения (SMTP_*, MAIL_*) — в файле окружения рядом с compose на сервере, не в репозитории.
# Его при каждом выкате пишет деплой (CI) из секретов GitHub (Н71), руками править не нужно: изменения затрутся.
# Compose включает значения env_file в конфигурацию сервиса, так что изменение настроек пересоздаёт app при up -d
# (а смена тега образа пересоздаёт его при каждом выкате в любом случае).
# Публичные NUXT_PUBLIC_* на пререндер не влияют: они запекаются в образ при сборке (build args в CI).
#
# Первый выпуск сертификата (после запуска стека, когда DNS mesto.studio и www указывает на VPS):
#   docker compose --env-file release.env run --rm --entrypoint certbot certbot certonly --webroot \
#     -w /var/www/certbot -d mesto.studio -d www.mesto.studio --email <почта владельца> --agree-tos --no-eff-email
#   затем docker compose --env-file release.env restart nginx (до этого nginx работает с самоподписанным сертификатом).
#
# Проверка при развёртывании (Н74): приложение должно видеть настоящий IP посетителя, иначе лимит заявок (Р37)
# сработает сразу на весь сайт. IP приходит в заголовке X-Real-IP от nginx, а nginx видит адрес, который ему
# оставил Docker. Что проверить на VPS после первого запуска:
#   1. Отправить заявку с телефона по мобильной сети и из дома (лучше и с IPv4, и с IPv6-адреса), затем
#      docker compose --env-file release.env logs app | grep "client ip is internal"
#      Строка «[lead] client ip is internal — check proxy / X-Real-IP (Н74)» = приложение видит внутренний адрес
#      (172.x, 10.x и т. п.): прокси или Docker подменяют IP, лимит считается на всех посетителей разом.
#   2. Если так — для IPv6-посетителей обычно виноват docker-proxy (userland proxy подменяет их адрес на адрес шлюза
#      Docker). Варианты: "userland-proxy": false в /etc/docker/daemon.json (затем systemctl restart docker,
#      все контейнеры перезапустятся) или включить IPv6 в сети Docker (ipv6: true у сети и подсеть ULA).
#   3. Второй прокси перед контейнерами (CDN, балансировщик, ещё один nginx на хосте) без настройки real_ip
#      (set_real_ip_from + real_ip_header) недопустим: nginx в контейнере увидит адрес прокси, а не посетителя.
# Эти настройки автоматически не включаются: на неизвестном VPS они могут не запустить Docker или сеть.
#
# Логи (Н43): у каждого сервиса ротация json-file, 5 файлов по 10 МБ (до 50 МБ на сервис), чтобы логи не росли без предела.
name: mesto

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  app:
    image: ghcr.io/${GHCR_OWNER:?задайте GHCR_OWNER в release.env}/mesto-app:${IMAGE_TAG:?задайте IMAGE_TAG в release.env}
    build:
      context: .
      target: app
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: .env
        required: false
    # Порт 3000 наружу не открывается: приложение доступно только через nginx.
    expose:
      - '3000'

  nginx:
    image: ghcr.io/${GHCR_OWNER:?задайте GHCR_OWNER в release.env}/mesto-nginx:${IMAGE_TAG:?задайте IMAGE_TAG в release.env}
    build:
      context: .
      target: nginx
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://mesto.studio}
        NUXT_PUBLIC_ANALYTICS_ENABLED: ${NUXT_PUBLIC_ANALYTICS_ENABLED:-false}
        NUXT_PUBLIC_GA_ID: ${NUXT_PUBLIC_GA_ID:-}
        NUXT_PUBLIC_YM_ID: ${NUXT_PUBLIC_YM_ID:-}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  certbot:
    # Н75: точная версия (обновляет Dependabot).
    image: certbot/certbot:v5.10.0
    restart: unless-stopped
    logging: *logging
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Продление Let's Encrypt: проверка дважды в сутки; certbot продлевает сертификат за 30 дней до конца срока.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  certbot-etc:
  certbot-www:
