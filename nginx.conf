# Заготовка — docs «Инфраструктура» → «Docker и Nginx». Доводит агент devops.
# TODO:
#  - http → https, www.mesto.studio → mesto.studio (301)
#  - TLS-сертификаты из certbot
#  - gzip и brotli
#  - статика с хешем в имени: Cache-Control: public, max-age=31536000, immutable; HTML — no-cache
#  - HSTS, X-Content-Type-Options, Referrer-Policy, CSP с доменами GA4 и Яндекс Метрики
#  - /services/ → 301 на /services (так же для всех адресов, включая /en/ → /en)
#  - неизвестный адрес: пререндеренная 404 со статусом 404 (под /en/ — EN-версия), а не главная

upstream mesto_app {
  server app:3000;
}

server {
  listen 80;
  server_name mesto.studio;

  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://mesto_app;
    # IP клиента для лимита заявок (Р37)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }
}
