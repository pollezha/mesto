# Инфраструктура → «Docker и Nginx» (Р20, Р21, Р37). Основной конфиг nginx из Alpine (стадия nginx в Dockerfile).
# Образ отдаёт пререндеренные страницы и статику из /usr/share/nginx/html, в контейнер app проксируется только POST /api/lead (Н76).

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Лог без тела запросов; заявки нигде не пишутся (Р18, Р42).
  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # Заявка — короткий JSON (message до 2000 символов, Р64); лишнее отсекается на входе.
  client_max_body_size 64k;

  # gzip и brotli (для клиентов без brotli — gzip).
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
  brotli on;
  brotli_comp_level 5;
  brotli_min_length 256;
  brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

  # Docker DNS: адрес контейнера app перечитывается, nginx стартует и без запущенного app.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Н73: лимит заявок перед приложением — 10 запросов в минуту с адреса (+ запас 10, см. location = /api/lead).
  # Ключ — адрес целиком ($binary_remote_addr). Группировку IPv6 по /64 через map по бинарному адресу
  # ("~(?s)^(?<net>.{8}).{8}$" → $net) не включаем: без запущенного nginx -t проверить её нельзя, а ошибка в map
  # не даст nginx стартовать. /64 считает приложение (Р37, Н73). Включать только после nginx -t на сервере.
  limit_req_zone $binary_remote_addr zone=lead:1m rate=10r/m;
  limit_req_status 429;
  # Отказы не пишутся в error_log (в нём IP посетителя, Н43): уровень ниже порога warn у error_log.
  limit_req_log_level notice;

  # Н72: повторные слэши в пути (до "?") → 301 на https://mesto.studio с одним слэшем. Работаем по сырому
  # $request_uri, а не по $uri: тот декодирован (%0d%0a, %3F, %2F вернулись бы в Location другими символами).
  # Хост в целевом адресе всегда mesto.studio, начинается результат всегда с "/": на чужой домен не уйти.
  # Каждая ступень схлопывает первую серию слэшей в пути; три ступени закрывают до трёх серий за один
  # редирект, остальные добираются следующими редиректами (число серий каждый раз убывает, цикла нет).
  map $request_uri $dedup1 {
    default "";
    "~^(?<h>[^?]*?)/{2,}(?<t>.*)$" "$h/$t";
  }
  map $dedup1 $dedup2 {
    default $dedup1;
    "~^(?<h>[^?]*?)/{2,}(?<t>.*)$" "$h/$t";
  }
  map $dedup2 $dedup3 {
    default $dedup2;
    "~^(?<h>[^?]*?)/{2,}(?<t>.*)$" "$h/$t";
  }

  # http: проверка Let's Encrypt, остальное — на https://mesto.studio (в том числе www.mesto.studio, Р20).
  server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://mesto.studio$request_uri;
    }
  }

  # https://www.mesto.studio → https://mesto.studio
  server {
    listen 443 ssl;
    http2 on;
    server_name www.mesto.studio;
    include /etc/nginx/ssl-cert.conf;
    include /etc/nginx/ssl-params.conf;

    return 301 https://mesto.studio$request_uri;
  }

  server {
    listen 443 ssl default_server;
    http2 on;
    server_name mesto.studio;
    include /etc/nginx/ssl-cert.conf;
    include /etc/nginx/ssl-params.conf;

    root /usr/share/nginx/html;

    # Неизвестный адрес — пререндеренная 404 со статусом 404, под /en/ — EN-версия.
    # Файлы 404.html отдаются только как страница ошибки (internal), сами /404, /en/404 — тоже 404, а не 200.
    error_page 404 /404.html;

    include /etc/nginx/security-headers.conf;

    # Н72: повторные слэши в пути. Пусто, если их нет.
    if ($dedup1 != "") {
      return 301 https://mesto.studio$dedup3;
    }

    # Н76: в приложение проксируется только POST /api/lead; IP клиента для лимита заявок (Р37) — в X-Real-IP.
    location = /api/lead {
      # Н43: запросы к /api/ не пишутся в access_log (там IP посетителей и адреса отправки форм).
      access_log off;
      # Заголовки безопасности ответа ставит Nitro (nosniff, X-Frame-Options, Referrer-Policy, CSP для API); здесь только HSTS и no-store.
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Cache-Control "no-store" always;
      # Н76: другие методы — 405 без обращения к приложению.
      if ($request_method != POST) {
        add_header Allow "POST" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store" always;
        return 405;
      }
      # Н73: 10 в минуту + запас 10 без задержки, сверх — 429.
      limit_req zone=lead burst=10 nodelay;
      set $app_upstream http://app:3000;
      proxy_pass $app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # Н76: всё остальное под /api/ — 404, приложение не затрагивается.
    location ^~ /api/ {
      access_log off;
      return 404;
    }

    # Завершающий слэш: /services/ → 301 /services (так же /en/ → /en), query сохраняется.
    location ~ ^(?<no_slash>/.+)/+$ {
      return 301 https://mesto.studio$no_slash$is_args$args;
    }

    # Манифест сборки Nuxt не имеет хеша в имени — без долгого кеша, иначе клиент не узнает о новой версии.
    location = /_nuxt/builds/latest.json {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # Хешированные файлы сборки (в имени хеш) — на год, без перепроверки.
    location ^~ /_nuxt/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Страницы ошибок отдаются только через error_page (internal): прямой запрос → 404 со страницей 404.
    location = /404.html {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    location = /en/404.html {
      internal;
      error_page 404 /en/404.html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # /404 и /en/404 — не дубль страницы со статусом 200 (со слэшем — сначала 301 на адрес без слэша).
    location = /404 {
      return 404;
    }

    location = /en/404 {
      error_page 404 /en/404.html;
      return 404;
    }

    # EN: неизвестный адрес под /en/ — en/404.html. Без ^~, чтобы /en/404 не попал сюда мимо точного совпадения.
    location /en/ {
      error_page 404 /en/404.html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri.html =404;
    }

    location = / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files /index.html =404;
    }

    # Технические имена файлов пререндера (/index.html, /services.html, /en.html, /en/services.html …) — 404 как у любого
    # неизвестного адреса. Внутренний try_files $uri.html это не затрагивает (location не пересматривается).
    location ~ ^/en(/.*)?\.html$ {
      error_page 404 /en/404.html;
      return 404;
    }

    location ~ \.html$ {
      return 404;
    }

    # Страницы без расширения: /services → services.html (пререндер без папок, autoSubfolderIndex: false);
    # прочие файлы (robots.txt, sitemap.xml, шрифты и картинки вне /_nuxt/) — как есть, с перепроверкой.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri.html =404;
    }
  }
}
